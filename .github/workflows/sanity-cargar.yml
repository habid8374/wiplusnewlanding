name: Cargar contenido en Sanity

# Botón manual (Actions › «Cargar contenido en Sanity» › Run workflow).
# Copia el contenido de content/ al panel /studio. Requiere el secreto SANITY_WRITE_TOKEN
# (token «Editor» creado en sanity.io/manage › API › Tokens).
on:
  workflow_dispatch:
    inputs:
      reemplazar:
        description: 'Sobrescribir lo que ya exista en Sanity con el contenido de content/ (¡borra las ediciones hechas en el panel!)'
        type: boolean
        default: false
      restaurar_barrios:
        description: 'Restaurar barrios borrados, formato «Municipio:Barrio|Municipio:Barrio» (vacío = no)'
        type: string
        default: ''
      restaurar_hasta:
        description: 'Fecha ISO: se toma la versión del historial anterior a este momento'
        type: string
        default: ''
      limpiar_muestras:
        description: 'Solo borrar los barrios de muestra (demo o «REEMPLAZAR…») y apagar el aviso de datos de muestra'
        type: boolean
        default: false
      solo_contacto:
        description: 'Con «datos_reales»: aplicar solo los datos de contacto (teléfonos, WhatsApp, correo, redes)'
        type: boolean
        default: false
      datos_reales:
        description: 'Solo aplicar los datos reales del volante (planes y precios, clientes, cuenta Bancolombia, WhatsApp, NIT, redes) sin tocar lo demás'
        type: boolean
        default: false

jobs:
  cargar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: k3vbxtev
      NEXT_PUBLIC_SANITY_DATASET: production
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: ${{ inputs.restaurar_barrios != '' }}
        run: npx --yes tsx@4 scripts/sanity-restaurar-barrios.ts "$BARRIOS" "$HASTA"
        env:
          BARRIOS: ${{ inputs.restaurar_barrios }}
          HASTA: ${{ inputs.restaurar_hasta }}
      - if: ${{ inputs.limpiar_muestras }}
        run: npx --yes tsx@4 scripts/sanity-limpiar-muestras.ts
      - if: ${{ !inputs.datos_reales && !inputs.limpiar_muestras && inputs.restaurar_barrios == '' }}
        run: npx --yes tsx@4 scripts/sanity-cargar.ts ${{ inputs.reemplazar && '--reemplazar' || '' }}
      - if: ${{ inputs.datos_reales && !inputs.limpiar_muestras && inputs.restaurar_barrios == '' }}
        run: npx --yes tsx@4 scripts/sanity-datos-reales.ts ${{ inputs.solo_contacto && '--solo-contacto' || '' }}
